name: Restore LMS with patched Java 17 (2026-11-18)

on:
  push:
    branches: [codex/lms-java17-restore-20261118]

permissions:
  contents: read

concurrency:
  group: mjsec-lms-java17-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      BACKEND_SHA: 4e8956a7ca5f6af29469682bb975c09d7442f745
      BACKEND_TAG: v-java17-cve-2026-114938-4e8956a
      BACKEND_IMAGE: mjsec0710/mjsec-lms-back
      SSH_HOST: ${{ secrets.HOST }}
      SSH_USER: ${{ secrets.USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}

    steps:
      - uses: actions/checkout@v4
      - name: Require successful backend tests and image publication
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/MJSEC-MJU/MJSEC_LMS_BACK/actions/runs'
          for attempt in {1..40}; do
            runs=$(curl -fsS --retry 2 --max-time 20 -G "$api" \
              --data-urlencode "head_sha=$BACKEND_SHA" --data-urlencode 'event=push')
            run=$(jq -c --arg tag "$BACKEND_TAG" --arg sha "$BACKEND_SHA" \
              '[.workflow_runs[] | select(.head_branch == $tag and .head_sha == $sha and .path == ".github/workflows/ci.yml")] | first // {}' <<< "$runs")
            status=$(jq -r '.status // "missing"' <<< "$run")
            if [[ "$status" == completed ]]; then
              conclusion=$(jq -r .conclusion <<< "$run")
              echo "Backend release CI: $conclusion ($(jq -r .html_url <<< "$run"))"
              [[ "$conclusion" == success ]]
              exit 0
            fi
            sleep 15
          done
          echo 'Backend release CI did not complete in time.' >&2
          exit 1

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve the release image digest and pin the server identity
        run: |
          set -euo pipefail
          info=$(docker buildx imagetools inspect "$BACKEND_IMAGE:$BACKEND_TAG")
          digest=$(awk '$1 == "Digest:" && !seen {print $2; seen=1}' <<< "$info")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'BACKEND_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"
          [[ "$SSH_HOST" == 14.42.48.191 || "$SSH_HOST" == mjsec.kr ]]
          [[ "$SSH_PORT" == 2222 && "$SSH_USER" == ialleejy ]]
          mkdir -m 700 "$RUNNER_TEMP/mjsec-restore"
          ssh-keyscan -T 10 -t ed25519 -p "$SSH_PORT" "$SSH_HOST" > "$RUNNER_TEMP/mjsec-known-hosts" 2>/dev/null
          [[ $(ssh-keygen -lf "$RUNNER_TEMP/mjsec-known-hosts" | awk '{print $2}') == 'SHA256:7+/z32wOTUDLksud67Wvir5GHU6k1vOW7g+SwnF+e0w' ]]

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Restore only LMS using the tested, fixed image
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/mjsec-restore.sh"
          {
            printf 'TRANSFORM_B64=%q\n' "$(base64 -w0 ops/incident-20261117/maintenance_config.py)"
            cat ops/incident-20261118/restore-lms.sh
          } > "$payload"
          set +e
          timeout -k 10 900 ssh -F /dev/null -o BatchMode=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/mjsec-known-hosts" \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$BACKEND_IMAGE' '$BACKEND_TAG' '$BACKEND_DIGEST'" \
            < "$payload" > "$RUNNER_TEMP/mjsec-restore/remote-output.txt" \
            2> "$RUNNER_TEMP/mjsec-restore/ssh-stderr.txt"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/mjsec-restore/exit-code.txt"
          echo "LMS restore exit code $rc. The server record is encrypted."
          exit "$rc"

      - name: Check the public routes after recovery
        run: |
          set -euo pipefail
          for url in https://mjsec.kr/ https://wiki.mjsec.kr/ https://mjsec.kr/lms/; do
            status=$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$url")
            printf '%s %s\n' "$url" "$status"
            [[ "$status" == 200 ]]
          done
          auth_url='https://mjsec.kr/lms/api/v1/auth/check-student-number?studentNumber=20300000'
          body="$RUNNER_TEMP/mjsec-restore/public-api.json"
          status=$(curl -sS --connect-timeout 5 --max-time 15 -o "$body" -w '%{http_code}' "$auth_url")
          jq -e --arg status "$status" '.code == "SUCCESS" and (($status == "200" and .data == true) or ($status == "409" and .data == false))' "$body" >/dev/null
          printf 'Public LMS DB-backed API returned the expected response (%s).\n' "$status"

      - name: Encrypt the deployment evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mjsec-restore"
          tar -C "$RUNNER_TEMP/mjsec-restore" -czf "$RUNNER_TEMP/mjsec-restore.tar.gz" .
          openssl cms -encrypt -binary -aes-256-gcm -recip ops/incident-20261117/recipient.crt.pem \
            -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/mjsec-restore.tar.gz" -outform DER -out "$RUNNER_TEMP/mjsec-restore.cms"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mjsec-encrypted-restore-${{ github.run_id }}
          path: ${{ runner.temp }}/mjsec-restore.cms
          if-no-files-found: error
          retention-days: 7
